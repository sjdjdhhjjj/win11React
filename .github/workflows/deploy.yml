name: Build-Deploy

on:
  push:
    branches: [ main ]   # 按你的触发分支修改

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18   # 换成你用的版本

      - name: Install dependencies
        run: npm ci          # 或 npm install

      - name: Build project
        run: npm run build   # 换成你的构建命令

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3   # 关键：从 v1 改为 v3
        with:
          path: ./build      # 换成你的实际输出目录（如 dist、public 等）

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4   # 已经升级到 v4
